  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.6" />
  <rect x="42" y="42" width="1116" height="546" rx="14" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />

