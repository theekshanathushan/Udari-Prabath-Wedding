      <stop offset="50%" stop-color="#420a15" />
      <stop offset="100%" stop-color="#22040b" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3b8" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a711c" />
    </linearGradient>
